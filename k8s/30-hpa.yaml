apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product-service
  namespace: flash-sale
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Low target so scale-out starts on the first metrics-server sample of the
          # ramp; AKS refreshes CPU only about once a minute.
          averageUtilization: 35
  behavior:
    scaleUp:
      # React immediately to a flash-sale spike: up to double, or +4 pods, every 15 s.
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
    scaleDown:
      # Wait 30 s of low load before removing pods (default is 5 min; shortened
      # so the demo shows scale-in quickly), then drop straight to the target.
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
