<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlashKart Sale</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #1a1d23; --muted: #626b78; --border: #e1e4e8;
    --accent: #d6336c; --accent-soft: #fde8ef; --ok: #2b8a3e; --chip: #eef1f5; --chip-new: #fff3bf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418; --surface: #1c1f25; --text: #e8eaed; --muted: #9aa3ae; --border: #2c3038;
      --accent: #f06595; --accent-soft: #3a1d29; --ok: #69db7c; --chip: #262a31; --chip-new: #4a3f12;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--accent); color: #fff; padding: 18px 16px; }
  header .wrap { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  header h1 { margin: 0; font-size: 1.5rem; letter-spacing: .3px; }
  header .tag { font-size: .95rem; opacity: .95; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  main { padding: 16px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filters button { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px;
                    padding: 6px 14px; cursor: pointer; font-size: .9rem; text-transform: capitalize; }
  .filters button.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px;
          display: flex; flex-direction: column; gap: 8px; }
  .card .cat { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .card h3 { margin: 0; font-size: 1rem; line-height: 1.3; min-height: 2.6em; }
  .price { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .price .now { font-size: 1.3rem; font-weight: 700; }
  .price .mrp { color: var(--muted); text-decoration: line-through; font-size: .9rem; }
  .price .off { background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: .8rem;
                padding: 2px 6px; border-radius: 6px; }
  .buy { display: flex; gap: 8px; align-items: center; margin-top: auto; }
  .buy select { padding: 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  .buy button { flex: 1; padding: 8px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  .total { font-size: .85rem; color: var(--muted); min-height: 1.2em; }
  .served { font-size: .72rem; color: var(--muted); font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
  aside { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 12px 16px; }
  aside h2 { margin: 0 0 6px; font-size: .85rem; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .live { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: .9rem; }
  .live .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
  .live code { font-family: ui-monospace, Consolas, monospace; }
  .pods { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pod { background: var(--chip); border-radius: 8px; padding: 3px 8px; font-family: ui-monospace, Consolas, monospace; font-size: .78rem; }
  .pod.current { outline: 2px solid var(--ok); }
  .pod.new { background: var(--chip-new); }
  .err { color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>FlashKart ⚡ Big Flash Sale</h1>
    <span class="tag">Up to 45% off · prices calculated live by the Product Service</span>
  </div>
</header>

<main class="wrap">
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"><p>Loading products…</p></div>
</main>

<aside>
  <div class="wrap">
    <h2>Live infrastructure</h2>
    <div class="live">
      <span><span class="dot"></span>Served by <code id="pod">{{ pod }}</code></span>
      <span>version <code id="version">{{ version }}</code></span>
      <span>latency <code id="latency">–</code></span>
      <span>pods seen <code id="podcount">1</code></span>
    </div>
    <div class="pods" id="pods"></div>
  </div>
</aside>

<script>
  // The aside polls /whoami every few seconds. Gunicorn drops idle keep-alive
  // connections after 2 s, so each poll opens a new connection that Kubernetes can
  // route to any pod: the list fills up as the HPA adds pods during a sale.
  const POLL_MS = 3000;
  const seen = new Map();   // pod name -> {count, firstSeen}
  let category = "all";

  const $ = (id) => document.getElementById(id);
  const inr = (n) => "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 2 });

  function recordPod(pod) {
    const entry = seen.get(pod) || { count: 0, firstSeen: Date.now() };
    entry.count += 1;
    seen.set(pod, entry);
    $("pod").textContent = pod;
    $("podcount").textContent = seen.size;
    const pods = $("pods");
    pods.replaceChildren(...[...seen.entries()].map(([name, e]) => {
      const chip = document.createElement("span");
      chip.className = "pod" + (name === pod ? " current" : "") + (Date.now() - e.firstSeen < 15000 ? " new" : "");
      chip.textContent = `${name.replace(/^product-service-/, "")} ×${e.count}`;
      chip.title = name;
      return chip;
    }));
  }

  async function whoami() {
    const t0 = performance.now();
    try {
      const res = await fetch("/whoami", { cache: "no-store" });
      const body = await res.json();
      $("latency").textContent = Math.round(performance.now() - t0) + " ms";
      $("version").textContent = body.version;
      recordPod(body.pod);
    } catch (err) {
      $("latency").innerHTML = '<span class="err">unreachable</span>';
    }
  }

  async function priceFor(id, qty) {
    const res = await fetch(`/products/${id}/price?qty=${qty}`, { cache: "no-store" });
    if (!res.ok) throw new Error((await res.json()).error || res.status);
    return { body: await res.json(), pod: res.headers.get("X-Served-By") };
  }

  function card(p) {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <span class="cat">${p.category}</span>
      <h3></h3>
      <div class="price"><span class="now">…</span><span class="mrp">${inr(p.mrp)}</span><span class="off"></span></div>
      <div class="buy">
        <select aria-label="Quantity">${[1, 2, 3, 4, 5].map((q) => `<option>${q}</option>`).join("")}</select>
        <button>Check price</button>
      </div>
      <div class="total"></div>
      <div class="served"></div>`;
    el.querySelector("h3").textContent = p.name;
    const show = async () => {
      const qty = Number(el.querySelector("select").value);
      try {
        const { body, pod } = await priceFor(p.id, qty);
        el.querySelector(".now").textContent = inr(body.unit_price);
        el.querySelector(".off").textContent = `${Math.round(body.discount_pct)}% off`;
        el.querySelector(".total").textContent = qty > 1 ? `${qty} × ${inr(body.unit_price)} = ${inr(body.total)}` : "";
        el.querySelector(".served").textContent = pod ? `priced by ${pod}` : "";
      } catch (err) {
        el.querySelector(".total").innerHTML = `<span class="err">${err.message}</span>`;
      }
    };
    el.querySelector("button").addEventListener("click", show);
    show();
    return el;
  }

  async function loadProducts() {
    const query = category === "all" ? "" : `?category=${encodeURIComponent(category)}`;
    const res = await fetch(`/products${query}`, { cache: "no-store" });
    const { products } = await res.json();
    $("grid").replaceChildren(...products.map(card));
  }

  async function init() {
    const res = await fetch("/products", { cache: "no-store" });
    const { products } = await res.json();
    const cats = ["all", ...new Set(products.map((p) => p.category))];
    $("filters").replaceChildren(...cats.map((c) => {
      const b = document.createElement("button");
      b.textContent = c;
      b.className = c === category ? "active" : "";
      b.addEventListener("click", () => {
        category = c;
        document.querySelectorAll("#filters button").forEach((x) => x.classList.toggle("active", x === b));
        loadProducts();
      });
      return b;
    }));
    recordPod({{ pod | tojson }});
    await loadProducts();
    setInterval(whoami, POLL_MS);
  }

  init();
</script>
</body>
</html>
